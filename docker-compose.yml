# =============================================================================
# SENTINEL - Complete Stack (All Phases)
# =============================================================================
# Combined docker-compose file for running all Sentinel components together
# =============================================================================

version: '3.8'

services:
  # API Server - Core component for all phases
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sentinel-api
    ports:
      - "8080:8080"
    environment:
      - API_PORT=8080
      - DB_PATH=/data/sentinel.db
      - EVENT_RETENTION_HOURS=24
      - LOG_LEVEL=info
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - sentinel-network
    restart: unless-stopped

  # Entropy Agent - Phase 1
  agent:
    build:
      context: ./agent
      dockerfile: Docker
    container_name: sentinel-agent
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_NAME=test-node-1
      - API_ENDPOINT=http://api:8080
      - SCAN_INTERVAL=30
      - MONITORED_NAMESPACES=demo-app
      - LOG_LEVEL=info
      # Kubernetes config (for local testing, may need kubeconfig mounted)
      - KUBECONFIG=/kubeconfig/config
    volumes:
      # Mount kubeconfig for local Kubernetes access
      # Note: On Windows, you may need to adjust this path
      - ${HOME}/.kube/config:/kubeconfig/config:ro
    networks:
      - sentinel-network
    restart: unless-stopped
    # Note: Agent requires Kubernetes cluster access

  # Purge Controller - Phase 3
  controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
    container_name: sentinel-controller
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_ENDPOINT=http://api:8080
      - RECONCILE_INTERVAL=10
      - DRY_RUN=true
      - PURGE_SPEED=moderate
      - LOG_LEVEL=info
      # Kubernetes config (for local testing, may need kubeconfig mounted)
      - KUBECONFIG=/kubeconfig/config
    volumes:
      # Mount kubeconfig for local Kubernetes access
      # Note: On Windows, you may need to adjust this path
      - ${HOME}/.kube/config:/kubeconfig/config:ro
    networks:
      - sentinel-network
    restart: unless-stopped
    # Note: Controller requires Kubernetes cluster access

volumes:
  api-data:
    driver: local

networks:
  sentinel-network:
    driver: bridge
