# =============================================================================
# SENTINEL - API Server Deployment
# =============================================================================
# Central API server for receiving drift reports and serving the UI
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  namespace: sentinel
  labels:
    app: sentinel-api
    app.kubernetes.io/name: sentinel-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-api
  template:
    metadata:
      labels:
        app: sentinel-api
        app.kubernetes.io/name: sentinel-api
    spec:
      serviceAccountName: sentinel-api
      containers:
        - name: api
          image: sentinel-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: API_PORT
              value: "8080"
            - name: DB_PATH
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: DB_PATH
            - name: EVENT_RETENTION_HOURS
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: EVENT_RETENTION_HOURS
            - name: MAX_EVENTS_PER_POD
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: MAX_EVENTS_PER_POD
            - name: CORS_ENABLED
              value: "true"
            - name: CORS_ORIGINS
              value: "*"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data
          emptyDir: {}
      restartPolicy: Always

---
# Service for API
apiVersion: v1
kind: Service
metadata:
  name: sentinel-api
  namespace: sentinel
  labels:
    app: sentinel-api
    app.kubernetes.io/name: sentinel-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: sentinel-api
