apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-controller
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-controller
    app.kubernetes.io/part-of: sentinel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinel-controller
  labels:
    app.kubernetes.io/name: sentinel-controller
    app.kubernetes.io/part-of: sentinel
rules:
  # Need full pod management to delete compromised pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # Need to read namespaces to check labels
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Need to create events for audit logging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Need to read deployments/statefulsets to understand ownership
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinel-controller
  labels:
    app.kubernetes.io/name: sentinel-controller
    app.kubernetes.io/part-of: sentinel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinel-controller
subjects:
  - kind: ServiceAccount
    name: sentinel-controller
    namespace: sentinel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-controller
  namespace: sentinel
  labels:
    app: sentinel-controller
    app.kubernetes.io/name: sentinel-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: sentinel
spec:
  # Only one controller to avoid duplicate purge decisions
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-controller
  template:
    metadata:
      labels:
        app: sentinel-controller
    spec:
      serviceAccountName: sentinel-controller
      containers:
        - name: controller
          image: sentinel-controller:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sentinel-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # API server endpoint to fetch scores
            - name: API_ENDPOINT
              value: "http://sentinel-api.sentinel.svc.cluster.local:8080"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
