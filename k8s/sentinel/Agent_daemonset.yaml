apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-agent
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-agent
    app.kubernetes.io/part-of: sentinel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinel-agent
  labels:
    app.kubernetes.io/name: sentinel-agent
    app.kubernetes.io/part-of: sentinel
rules:
  # Need to list and watch pods to know what to monitor
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Need to exec into containers to inspect them
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Need to read namespaces to check labels
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Need to read nodes for node info
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinel-agent
  labels:
    app.kubernetes.io/name: sentinel-agent
    app.kubernetes.io/part-of: sentinel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinel-agent
subjects:
  - kind: ServiceAccount
    name: sentinel-agent
    namespace: sentinel
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sentinel-agent
  namespace: sentinel
  labels:
    app: sentinel-agent
    app.kubernetes.io/name: sentinel-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: sentinel
spec:
  selector:
    matchLabels:
      app: sentinel-agent
  template:
    metadata:
      labels:
        app: sentinel-agent
    spec:
      serviceAccountName: sentinel-agent
      # Run on all nodes including control plane (for minikube)
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: sentinel-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sentinel-config
          env:
            # Inject the node name so agent knows which node it's on
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # API server endpoint
            - name: API_ENDPOINT
              value: "http://sentinel-api.sentinel.svc.cluster.local:8080"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            # Need elevated privileges to inspect containers
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            # Mount container runtime socket to inspect containers
            - name: containerd-socket
              mountPath: /run/containerd/containerd.sock
              readOnly: true
            # Alternative: Docker socket (for Docker Desktop)
            - name: docker-socket
              mountPath: /var/run/docker.sock
              readOnly: true
      volumes:
        - name: containerd-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
      # Prefer running on nodes with containers to monitor
      priorityClassName: system-node-critical
