apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
  namespace: demo-app
  labels:
    app: nginx
    app.kubernetes.io/name: nginx-web
    app.kubernetes.io/component: webserver
    sentinel.io/monitored: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        sentinel.io/monitored: "true"
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          # Readiness probe for K8s to know when pod is ready
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness probe for K8s to restart unhealthy pods
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-web
  namespace: demo-app
  labels:
    app: nginx
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
