# =============================================================================
# SENTINEL - Phase 3: Purge Controller + API Testing
# =============================================================================
# Tests the Purge Controller with API Server dependency
# Controller runs in DRY_RUN mode for safety
#
# Usage:
#   docker compose -f docker-compose.phase3.yml up -d
#   docker compose -f docker-compose.phase3.yml logs -f
#   docker compose -f docker-compose.phase3.yml down -v
# =============================================================================



services:
  # API Server - Required dependency for Controller
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: sentinel-api:phase3
    container_name: sentinel-api-phase3
    ports:
      - "8080:8080"
    environment:
      - API_PORT=8080
      - DB_PATH=/data/sentinel.db
      - EVENT_RETENTION_HOURS=24
      - LOG_LEVEL=debug
      - CORS_ENABLED=true
      # Seed data for controller to process
      - SEED_DEMO_DATA=true
      - DEMO_POD_COUNT=10
    volumes:
      - phase3-api-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - phase3-network
    restart: unless-stopped

  # Purge Controller - Phase 3 Component
  controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
    image: sentinel-controller:phase3
    container_name: sentinel-controller-phase3
    depends_on:
      api:
        condition: service_healthy
    environment:
      # API connection
      - API_ENDPOINT=http://api:8080
      - API_TIMEOUT=30
      # Controller configuration
      - RECONCILE_INTERVAL=10
      - LEADER_ELECTION=false
      # IMPORTANT: Always dry-run in tests to prevent actual deletions
      - DRY_RUN=true
      # Purge configuration
      - PURGE_SPEED=moderate
      - DEFAULT_THRESHOLD=30
      - GRACE_PERIOD=30
      # Logging
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
    networks:
      - phase3-network
    restart: unless-stopped

  # Agent in demo mode to generate test data
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: sentinel-agent:phase3
    container_name: sentinel-agent-phase3
    profiles:
      - with-agent
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_NAME=phase3-test-node
      - API_ENDPOINT=http://api:8080
      - SCAN_INTERVAL=10
      - DEMO_MODE=true
      - DEMO_POD_COUNT=10
      - DEMO_DRIFT_PROBABILITY=0.2
      - MONITORED_NAMESPACES=demo-app
      - LOG_LEVEL=debug
    networks:
      - phase3-network
    restart: unless-stopped

volumes:
  phase3-api-data:
    driver: local

networks:
  phase3-network:
    driver: bridge
    name: sentinel-phase3-network
