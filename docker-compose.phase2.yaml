# =============================================================================
# SENTINEL - Phase 2: API Server Standalone Testing
# =============================================================================
# Tests the API Server in isolation - no Kubernetes required
#
# Usage:
#   docker compose -f docker-compose.phase2.yml up -d
#   docker compose -f docker-compose.phase2.yml logs -f
#   docker compose -f docker-compose.phase2.yml down -v
#
# Test endpoints:
#   curl http://localhost:8080/health
#   curl http://localhost:8080/api/leaderboard
#   curl http://localhost:8080/api/stats
#   curl http://localhost:8080/api/pods
#   curl http://localhost:8080/api/events
#   curl http://localhost:8080/api/config
# =============================================================================



services:
  # API Server - Standalone
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: sentinel-api:phase2
    container_name: sentinel-api-phase2
    ports:
      - "8080:8080"
    environment:
      # Server configuration
      - API_PORT=8080
      - API_HOST=0.0.0.0
      # Database
      - DB_PATH=/data/sentinel.db
      - DB_MAX_CONNECTIONS=10
      # Event retention
      - EVENT_RETENTION_HOURS=24
      - CLEANUP_INTERVAL_MINUTES=30
      # Logging
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
      # CORS
      - CORS_ENABLED=true
      - CORS_ORIGINS=*
      # WebSocket
      - WS_PING_INTERVAL=30
      - WS_PONG_TIMEOUT=10
      # Seed demo data for testing
      - SEED_DEMO_DATA=true
      - DEMO_POD_COUNT=10
    volumes:
      - phase2-api-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - phase2-network
    restart: unless-stopped

  # Optional: Data seeder for testing
  seeder:
    build:
      context: ./scripts
      dockerfile: Dockerfile.seeder
    image: sentinel-seeder:phase2
    container_name: sentinel-seeder-phase2
    profiles:
      - seed
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_ENDPOINT=http://api:8080
      - POD_COUNT=15
      - EVENT_COUNT=50
      - SEED_INTERVAL=0
    networks:
      - phase2-network
    restart: "no"

volumes:
  phase2-api-data:
    driver: local

networks:
  phase2-network:
    driver: bridge
    name: sentinel-phase2-network
