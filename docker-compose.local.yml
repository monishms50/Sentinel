# =============================================================================
# SENTINEL - Local Testing (All Phases) - Architecture Fixed
# =============================================================================
# This compose file runs all phases together with explicit platform settings
# to fix the "exec format error" on VMware/x86_64 systems.
#
# IMPORTANT: This file uses explicit platform targeting to ensure binaries
# are compiled for the correct architecture.
#
# Usage:
#   # Option 1: Build with platform fix
#   DOCKER_DEFAULT_PLATFORM=linux/amd64 docker compose -f docker-compose.local.yml build --no-cache
#
#   # Option 2: Use this file directly (platform is specified in the file)
#   docker compose -f docker-compose.local.yml build --no-cache
#   docker compose -f docker-compose.local.yml up -d
#
#   # View all logs
#   docker compose -f docker-compose.local.yml logs -f
#
#   # View specific service
#   docker compose -f docker-compose.local.yml logs -f api
#   docker compose -f docker-compose.local.yml logs -f agent
#   docker compose -f docker-compose.local.yml logs -f controller
#
#   # Stop everything
#   docker compose -f docker-compose.local.yml down -v
#
# Access Points:
#   - API:        http://localhost:8080
#   - Health:     http://localhost:8080/health
#   - WebSocket:  ws://localhost:8080/ws
# =============================================================================

services:
  # ===========================================================================
  # PHASE 1, 2, 3: API Server (Core Component)
  # ===========================================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - TARGETOS=linux
        - TARGETARCH=amd64
    image: sentinel-api:local
    container_name: sentinel-api-local
    # CRITICAL: Force the platform to match host architecture
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      # Server
      - API_PORT=8080
      - DB_PATH=/data/sentinel.db
      # Data retention
      - EVENT_RETENTION_HOURS=24
      - MAX_EVENTS_PER_POD=100
      # CORS
      - CORS_ENABLED=true
      - CORS_ORIGINS=*
      # Seeding for testing
      - SEED_DEMO_DATA=true
      - DEMO_POD_COUNT=10
      # Logging
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
    volumes:
      - local-api-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - local-network
    restart: unless-stopped

  # ===========================================================================
  # PHASE 1: Entropy Agent (Demo Mode)
  # ===========================================================================
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
      args:
        - TARGETOS=linux
        - TARGETARCH=amd64
    image: sentinel-agent:local
    container_name: sentinel-agent-local
    platform: linux/amd64
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Agent identification
      - NODE_NAME=local-test-node
      - AGENT_ID=agent-local-001
      # API connection
      - API_ENDPOINT=http://api:8080
      - API_TIMEOUT=30
      - API_RETRY_ATTEMPTS=3
      - API_RETRY_DELAY=5
      # Scanning
      - SCAN_INTERVAL=15
      - INITIAL_DELAY=3
      # Demo mode - generates simulated data
      - DEMO_MODE=true
      - DEMO_POD_COUNT=10
      - DEMO_DRIFT_PROBABILITY=0.15
      # Namespaces
      - MONITORED_NAMESPACES=demo-app,default
      # Logging
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
    networks:
      - local-network
    restart: unless-stopped

  # ===========================================================================
  # PHASE 3: Purge Controller (Dry-Run Mode)
  # ===========================================================================
  controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
      args:
        - TARGETOS=linux
        - TARGETARCH=amd64
    image: sentinel-controller:local
    container_name: sentinel-controller-local
    platform: linux/amd64
    depends_on:
      api:
        condition: service_healthy
      # Wait for agent to generate some data first
      agent:
        condition: service_started
    environment:
      # API connection
      - API_ENDPOINT=http://api:8080
      - API_TIMEOUT=30
      # Controller configuration
      - RECONCILE_INTERVAL=10
      - LEADER_ELECTION=false
      # SAFETY: Always dry-run in local testing
      - DRY_RUN=true
      # Purge configuration
      - PURGE_SPEED=moderate
      - DEFAULT_THRESHOLD=30
      - GRACE_PERIOD=30
      # Logging
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
    networks:
      - local-network
    restart: unless-stopped

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  local-api-data:
    driver: local
    name: sentinel-local-api-data

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  local-network:
    driver: bridge
    name: sentinel-local-network
