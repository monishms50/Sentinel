# =============================================================================
# SENTINEL - Phase 1: Agent + API Testing
# =============================================================================
# Tests the Entropy Agent with API Server dependency
# No Kubernetes required - uses demo mode
#
# Usage:
#   docker compose -f docker-compose.phase1.yml up -d
#   docker compose -f docker-compose.phase1.yml logs -f
#   docker compose -f docker-compose.phase1.yml down -v
# =============================================================================


services:
  # API Server - Required dependency for Agent
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: sentinel-api:phase1
    container_name: sentinel-api-phase1
    ports:
      - "8080:8080"
    environment:
      - API_PORT=8080
      - DB_PATH=/data/sentinel.db
      - EVENT_RETENTION_HOURS=24
      - LOG_LEVEL=debug
      - CORS_ENABLED=true
    volumes:
      - phase1-api-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - phase1-network
    restart: unless-stopped

  # Entropy Agent - Phase 1 Component (Demo Mode)
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: sentinel-agent:phase1
    container_name: sentinel-agent-phase1
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Agent identification
      - NODE_NAME=phase1-test-node
      - AGENT_ID=agent-phase1-001
      # API connection
      - API_ENDPOINT=http://api:8080
      - API_TIMEOUT=30
      # Scanning
      - SCAN_INTERVAL=15
      - INITIAL_DELAY=3
      # Demo mode for local testing
      - DEMO_MODE=true
      - DEMO_POD_COUNT=8
      - DEMO_DRIFT_PROBABILITY=0.15
      # Namespaces
      - MONITORED_NAMESPACES=demo-app
      # Logging
      - LOG_LEVEL=debug
    networks:
      - phase1-network
    restart: unless-stopped

volumes:
  phase1-api-data:
    driver: local

networks:
  phase1-network:
    driver: bridge
    name: sentinel-phase1-network
