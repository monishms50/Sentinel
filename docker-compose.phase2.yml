# =============================================================================
# SENTINEL - Phase 2: API Server Standalone Testing
# =============================================================================
# Tests the API Server (Phase 2) independently
# =============================================================================

version: '3.8'

services:
  # API Server - Phase 2 Component
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sentinel-api-phase2
    ports:
      - "8080:8080"
    environment:
      - API_PORT=8080
      - DB_PATH=/data/sentinel.db
      - EVENT_RETENTION_HOURS=24
      - LOG_LEVEL=info
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - sentinel-network
    restart: unless-stopped

volumes:
  api-data:
    driver: local

networks:
  sentinel-network:
    driver: bridge
